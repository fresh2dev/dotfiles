[settings]
dotfiles.root = "."

[dotfiles]
"~/.dotfiles" = { source = "home/", mode = "symlink" }
"~/.config/mise" = { source = "home/.config/mise", mode = "symlink-each" }
"~/.config/mise/justfile" = { source = "justfile", mode = "symlink" }
# DO NOT ADD DOTFILE ENTRIES HERE
# Leave this repo and run `mise dot add` or edit ~/.config/mise/config.toml directly.

[tools]
just = "1"
dprint = "0"
ruby = "4"
