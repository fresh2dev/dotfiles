ty = { version = "0.0.84", lazy = true }
"pypi:basedpyright" = { version = "1.40.2", lazy = true, lazy_bins = ["basedpyright", "basedpyright-langserver"] }
"pypi:pyrefly" = { version = "1.3.2", lazy = true, lazy_bins = ["pyrefly"] }
"pypi:zuban" = { version = "0.10.0", lazy = true, lazy_bins = ["zuban", "zmypy"] }

# --- Go
"go:golang.org/x/tools/gopls" = { version = "0.23.0", lazy = true, lazy_bins = ["gopls"] }
"go:golang.org/x/tools/cmd/goimports" = { version = "0.51.0", lazy = true, lazy_bins = ["goimports"] }
gofumpt = { version = "0.12.0", lazy = true }
staticcheck = { version = "2026.2.1", lazy = true }

# --- Kubernetes / containers
kubectl = { version = "1.37.1", lazy = true }
kubectx = { version = "0.11.0", lazy = true, lazy_bins = ["kubectx", "kubens"] }
k9s = { version = "0.51.0", lazy = true }
k3d = { version = "5.9.0", lazy = true }
stern = { version = "1.34.0", lazy = true }
helm = { version = "4.3.0", lazy = true }
helmwave = { version = "0.44.4", lazy = true }
"npm:cdk8s-cli" = { version = "2.207.63", lazy = true, lazy_bins = ["cdk8s"] }
docker-cli = { version = "29.8.2", lazy = true }
docker-compose = { version = "5.6.0", lazy = true }

"pypi:markitdown" = { version = "0.1.8", extras = "pdf,audio-transcription,youtube-transcription", lazy = true, lazy_bins = ["markitdown"] }
pandoc = { version = "3.12", lazy = true }
zola = { version = "0.23.6", lazy = true }
hugo = { version = "0.167.0", lazy = true }
gomplate = { version = "5.2.0", lazy = true }

ffmpeg = { version = "9.0.2", lazy = true }
exiftool = { version = "13.59", lazy = true }
yt-dlp = { version = "2026.08.19", rename_exe = "yt-dlp", lazy = true }

# --- LLM
claude = { version = "2.1.292", lazy = true }
"cargo:cship" = { version = "1.8.3", lazy = true, lazy_bins = ["cship"] }
"github:Dicklesworthstone/beads_rust" = { version = "0.7.4", lazy = true, lazy_bins = ["br"] }
"github:Dicklesworthstone/beads_viewer" = { version = "0.25.2", lazy = true, lazy_bins = ["bv"] }
"npm:ralph-tui" = { version = "0.12.0", lazy = true, lazy_bins = ["ralph-tui"] }
"npm:skills" = { version = "1.7.1", lazy = true, lazy_bins = ["skills"] }
hunk = { version = "0.23.0", lazy = true, lazy_bins = ["hunk"] }
"pypi:graphifyy" = { version = "0.9.79", lazy = true, lazy_bins = ["graphify"], postinstall = "graphify install --platform claude" }

# --- Cloudflare
cloudflare-cf = { version = "1.0.0-beta.12", lazy = true }
wrangler = { version = "4.148.0", allow_builds = ["esbuild", "sharp", "workerd"], lazy = true }
"pypi:b2" = { version = "5.0.0", lazy = true, lazy_bins = ["b2"] }

# --- Network / Security
mkcert = { version = "1.4.4", lazy = true }
"go:github.com/yutat23/lsoff" = { version = "0.1.5", lazy = true, lazy_bins = ["lsoff"] }
"go:github.com/ramonvermeulen/whosthere" = { version = "0.9.0", lazy = true, lazy_bins = ["whosthere"] }
bitwarden-secrets-manager = { version = "latest", lazy = true }

# --- Zellij plugins
# Each release ships a `.wasm` asset, not a binary, so `asset_pattern` picks it and
# `postinstall` symlinks it into $ZELLIJ_CONFIG_DIR/plugins, where config.kdl loads it.
# Upgrades re-run `postinstall`, so the link follows the installed version.
[tools."github:dj95/zjstatus"]
version = "0.25.0"
asset_pattern = "zjstatus.wasm"
postinstall = 'ln -sf "$MISE_TOOL_INSTALL_PATH"/*.wasm "$ZELLIJ_CONFIG_DIR/plugins/"'

[tools."github:codingfragments/zellij-zextract"]
version = "0.4.0"
asset_pattern = "zextract.wasm"
postinstall = 'ln -sf "$MISE_TOOL_INSTALL_PATH"/*.wasm "$ZELLIJ_CONFIG_DIR/plugins/"'

[tools."github:bezbac/zellij-tabula"]
version = "0.6.0"
asset_pattern = "zellij-tabula.wasm"
postinstall = 'ln -sf "$MISE_TOOL_INSTALL_PATH"/*.wasm "$ZELLIJ_CONFIG_DIR/plugins/"'

[tools."github:rashidalnaemi/zellij-commandpalette"]
version = "0.1.1"
asset_pattern = "zellij-commandpalette.wasm"
postinstall = 'ln -sf "$MISE_TOOL_INSTALL_PATH"/*.wasm "$ZELLIJ_CONFIG_DIR/plugins/"'

[tools."github:fresh2dev/zellij-attention"]
version = "0.4.0-rc.1"
asset_pattern = "zellij-attention.wasm"
postinstall = 'ln -sf "$MISE_TOOL_INSTALL_PATH"/*.wasm "$ZELLIJ_CONFIG_DIR/plugins/"'

[tools."github:715d/zellij-claude"]
version = "0.1.1"
asset_pattern = "zellij-claude.wasm"
postinstall = 'ln -sf "$MISE_TOOL_INSTALL_PATH"/*.wasm "$ZELLIJ_CONFIG_DIR/plugins/"'

