[settings]
# Disable mise auto-update
auto_update = false
# Pin versions in this file
pin = true
# Emit raw output from backend installers
raw = true
# Don't update tools released less than `minimum_release_age`
minimum_release_age = "0h"
# Default is `true`; disable to prevent shell expansion in env vars
env_shell_expand = true
# Dotfiles config
dotfiles.root = "~/.dotfiles"
dotfiles.default_mode = "symlink"

[settings.npm]
package_manager = "bun"

# [hooks]
# cd = "echo 'I changed directories'"
# enter = "echo 'I entered the project'"
# leave = "echo 'I left the project'"

[env]
XDG_CONFIG_HOME = "{{ env.HOME }}/.config"
# XDG_DATA_HOME = "{{ env.HOME }}/.local/share"
# XDG_CACHE_HOME = "{{ env.HOME }}/.cache"
# XDG_STATE_HOME = "{{ env.HOME }}/.local/state"

GIT_CONFIG_GLOBAL = "{{ env.HOME }}/.gitconfig"
RUSTUP_HOME = "{{ env.HOME }}/.rustup"
CARGO_HOME = "{{ env.HOME }}/.cargo"
BUN_INSTALL = "{{ env.HOME }}/.bun"
GOPATH = "{{ env.HOME }}/go"
GHQ_ROOT = "{{ env.HOME }}/projects"

_.path = ["{{ env.HOME }}/.local/bin", "/opt/homebrew/bin", "$GOPATH/bin"]

VISUAL = "nvim"
EDITOR = "nvim"

GH_CONFIG_DIR = "$XDG_CONFIG_HOME/gh"
STARSHIP_CONFIG = "$XDG_CONFIG_HOME/starship.toml"
RIPGREP_CONFIG_PATH = "$XDG_CONFIG_HOME/ripgreprc"
YAMLFIX_CONFIG_PATH = "$XDG_CONFIG_HOME/yamlfix"
LG_CONFIG_FILE = "$XDG_CONFIG_HOME/lazygit/config.yml"
FZF_DEFAULT_OPTS_FILE = "$XDG_CONFIG_HOME/fzf/fzfrc"
FZF_DEFAULT_COMMAND = "rg --files"
# Added to FZF_DEFAULT_OPTS_FILE.
_ZO_FZF_OPTS = "--border=none --no-sort"
_ZO_EXCLUDE_DIRS = "/tmp/*:/private/tmp/*:/var/*:/mnt/*"
_ZO_MAXAGE = 1000

[shell_alias]
ls = "lsd -a"
ll = "ls -la"
la = "ls -A"
lt = "ls --tree"
cat = "bat"
q = "exit"
qq = "exit"
g = "git"
G = "git"
gg = "lazygit"
j = "just"
so = "source"
v = "$VISUAL"
vq = "nvim - -c 'autocmd UIEnter * ++once silent! %s/\\e\\[[0-9;]*m//ge | cbuffer | bdelete! | cc | copen | wincmd p'"
ff = "nvim -c 'autocmd UIEnter * ++once normal 1 ff'"
kc = "kubectl"
cdt = "cd $(mktemp -d)"
currentmillis = "echo $(($(date +%s) * 1000))"
watch = "viddy --shell $SHELL"
less = "gum pager"
pause = "gum confirm 'Continue?'"
sshs = "purple"
cld = "claude --dangerously-skip-permissions"
cldc = "cld --continue"
scc = "tokei"  # "source code counter"
clear-color = 'fzf --ansi --no-sort --filter "^"'

[tasks]
recipes = [
  "just -f $MISE_CONFIG_DIR/justfile",
]

# valid phases are: pre-packages, post-packages, pre-repos, post-repos, pre-dotfiles, post-dotfiles, pre-defaults, post-defaults, pre-user, post-user, pre-tools, post-tools, final
[bootstrap.hooks.pre-tools]
run = [
  'mkdir -p "$HOME/.local/bin"',
  'mkdir -p "${XDG_CONFIG_HOME}"',
]

[bootstrap.hooks.post-tools]
run = [
  # "nvim --headless -c 'lua vim.pack.update()' -c 'qa'",
]

[tools]
# --- Languages / runtimes
python = "3.15.1"
go = "1.27.3"
node = "26.12.1"
rust = "1.99.1"
uv = "0.13.10"
cargo-binstall = "1.28.0"
bun = "1.4.4"
ruby = "4.0.9"
rust-analyzer = { version = "2026-11-02", lazy = true }
"cargo:cargo-edit" = { version = "0.13.14", lazy = true, lazy_bins = ["cargo-add", "cargo-rm", "cargo-upgrade", "cargo-set-version"] }
# powershell = { version = "7.6.8", lazy = true, lazy_bins = ["pwsh"] }

# --- Shell / terminal
# Link each uutils applet into ~/.local/bin; the binary dispatches on argv[0].
coreutils = { version = "0.12.0", postinstall = 'bin="$(find "$MISE_TOOL_INSTALL_PATH" -type f -name coreutils)" && "$bin" --list | xargs -I{} ln -sf "$bin" "$HOME/.local/bin/{}"' }
bat = "0.26.1"
direnv = "2.38.2"
fzf = "0.75.0"
yq = "4.54.3"
jq = "1.8.2"
gum = "2.0.2"
just = "1.59.0"
lsd = "1.2.0"
ripgrep = "16.0.0"
starship = "1.27.0"
zoxide = "0.10.0"
viddy = { version = "1.3.1", lazy = true }
bottom = { version = "0.15.0", lazy = true, lazy_bins = ["btm"] }
"cargo:purple-ssh" = { version = "3.34.2", lazy = true, lazy_bins = ["purple"] }
"cargo:pastel" = { version = "0.12.0", lazy = true, lazy_bins = ["pastel"] }
gping = { version = "1.21.0", lazy = true }
"cargo:hyperfine" = { version = "2.0.0", lazy = true, lazy_bins = ["hyperfine"] }
dua = { version = "3.0.3", lazy = true }
tokei = { version = "15.0.0", lazy = true, lazy_bins = ["tokei"] }
"go:github.com/knqyf263/pet" = { version = "1.0.1", lazy = true, lazy_bins = ["pet"] }
"go:github.com/maaslalani/sheets" = { version = "0.3.0", lazy = true, lazy_bins = ["sheets"] }

# --- Git
delta = "0.20.1"
lazygit = "0.66.3"
"cargo:git-graph" = "0.8.3"
"cargo:git-absorb" = "0.9.0"
ghq = "1.12.0"
github-cli = { version = "2.105.0", lazy = true, lazy_bins = ["gh"] }
"git-filter-repo" = { version = "2.47.0", lazy = true, lazy_bins = ["git-filter-repo"] }
"cargo:deadbranch" = { version = "0.4.0", lazy = true, lazy_bins = ["deadbranch"] }
"go:github.com/hjr265/gittop" = { version = "0.6.0", lazy = true, lazy_bins = ["gittop"] }
"cargo:drydock" = { version = "1.4.2", lazy = true, lazy_bins = ["drydock"] }
# Must specify `bin = "wt"` to avoid installing `git-wt` and shadowing the `git wt` alias.
"cargo:worktrunk" = { version = "0.83.0", bin = "wt", lazy = true, lazy_bins = ["wt"] }

# --- Editors / LSP / formatters / linters
# `nightly` is a moving tag: mise never refreshes it, so `upgrade` reinstalls it with --force.
neovim = "nightly"
luajit = "2.1.1744318430"
"pypi:neovim-remote" = "2.5.1"
# Force tree-sitter-cli to install without `cargo-binstall` so it compiles against the current glibc version.
"cargo:tree-sitter-cli" = { version = "0.27.2", default-features = "false" }
"cargo:stylua" = { version = "2.6.0", features = "luajit", lazy = true, lazy_bins = ["stylua"] }
dprint = "0.65.0"
rumdl = "0.3.6"
shfmt = { version = "3.14.1", lazy = true }
tombi = { version = "1.11.3", lazy = true }
lua-language-server = { version = "3.19.2", lazy = true }
"pypi:just-lsp" = "0.12.0"
copier = { version = "9.19.1", lazy = true }
prek = "0.5.11"
typos = { version = "1.52.2", lazy = true, lazy_bins = ["typos"] }
shellcheck = { version = "0.11.0", lazy = true, lazy_bins = ["shellcheck"] }
"cargo:shellharden" = { version = "4.3.2", lazy = true, lazy_bins = ["shellharden"] }
dotenv-linter = { version = "4.0.0", lazy = true, lazy_bins = ["dotenv-linter"] }
"npm:bash-language-server" = { version = "5.8.1", lazy = true, lazy_bins = ["bash-language-server"] }
yamllint = { version = "1.38.0", lazy = true }
"pypi:yamlfix" = { version = "1.19.1", lazy = true, lazy_bins = ["yamlfix"] }

# --- Python
ruff = { version = "0.17.6", lazy = true }
ty = { version = "0.0.109", lazy = true }

# --- Go
"go:golang.org/x/tools/gopls" = { version = "0.24.0", lazy = true, lazy_bins = ["gopls"] }
"go:golang.org/x/tools/cmd/goimports" = { version = "0.52.0", lazy = true, lazy_bins = ["goimports"] }
gofumpt = { version = "0.12.0", lazy = true }
staticcheck = { version = "2026.2.2", lazy = true }

# --- Kubernetes / containers
kubectl = { version = "1.37.2", lazy = true }
kubectx = { version = "0.11.0", lazy = true, lazy_bins = ["kubectx", "kubens"] }
k9s = { version = "0.51.0", lazy = true }
k3d = { version = "5.9.0", lazy = true }
stern = { version = "1.35.0", lazy = true }
helm = { version = "4.3.1", lazy = true }
helmwave = { version = "0.44.4", lazy = true }
"npm:cdk8s-cli" = { version = "2.207.78", lazy = true, lazy_bins = ["cdk8s"] }
docker-cli = { version = "29.9.2", lazy = true }
docker-compose = { version = "5.6.1", lazy = true }

"pypi:markitdown" = { version = "0.1.8", extras = "pdf,audio-transcription,youtube-transcription", lazy = true, lazy_bins = ["markitdown"] }
pandoc = { version = "3.12.1", lazy = true }
zola = { version = "0.23.6", lazy = true }
hugo = { version = "0.168.0", lazy = true }
gomplate = { version = "5.3.1", lazy = true }

ffmpeg = { version = "9.1.0", lazy = true }
exiftool = { version = "13.59", lazy = true }
yt-dlp = { version = "2026.08.19", rename_exe = "yt-dlp", lazy = true }

# --- LLM
claude = { version = "2.1.332", lazy = true }
"github:Dicklesworthstone/beads_rust" = { version = "0.7.6", lazy = true, lazy_bins = ["br"] }
"github:Dicklesworthstone/beads_viewer" = { version = "0.28.0", lazy = true, lazy_bins = ["bv"] }
"npm:skills" = { version = "1.9.0", lazy = true, lazy_bins = ["skills"] }
"pypi:graphifyy" = { version = "0.9.105", postinstall = "graphify install --platform claude", lazy = true, lazy_bins = ["graphify"] }

# --- Cloudflare
cloudflare-cf = { version = "1.0.0-beta.24", lazy = true }
wrangler = { version = "4.152.0", allow_builds = ["esbuild", "sharp", "workerd"], lazy = true }
"pypi:b2" = { version = "5.0.3", lazy = true, lazy_bins = ["b2"] }

# --- Network / Security
mkcert = { version = "1.4.4", lazy = true }
"go:github.com/yutat23/lsoff" = { version = "0.1.6", lazy = true, lazy_bins = ["lsoff"] }
"go:github.com/ramonvermeulen/whosthere" = { version = "0.9.0", lazy = true, lazy_bins = ["whosthere"] }
bitwarden-secrets-manager = { version = "2.1.0", lazy = true }

[dotfiles]
"~/.ansible.cfg" = {}
"~/.cargo/binstall.toml" = {}
"~/.claude/CLAUDE.md" = {}
"~/.claude/keybindings.json" = {}
# `claude-hud` must link the directory (not the `config.json` file) because it evidently wants a real file, not a symlink.
"~/.claude/plugins/claude-hud" = {}
"~/.claude/settings.json" = {}
"~/.config/AGENTS.md" = { source = "~/.dotfiles/.claude/CLAUDE.md" }
"~/.config/alacritty/alacritty.toml" = {}
"~/.config/atuin/config.toml" = {}
"~/.config/bat" = {}
"~/.config/colima/default/colima.yaml" = { mode = "symlink", variants = [{ os = "macos" }] }
"~/.config/direnv/direnv.toml" = {}
"~/.config/direnv/direnvrc" = {}
"~/.config/dprint/dprint.jsonc" = {}
"~/.config/drydock/config.toml" = {}
"~/.config/fd/ignore" = {}
"~/.config/fzf/fzfrc" = {}
"~/.config/gh/config.yml" = {}
"~/.config/ghostty" = {}
"~/.config/git" = {}
"~/.config/k9s" = {}
"~/.config/lazygit/config.yml" = {}
"~/.config/moxide/settings.toml" = {}
"~/.config/myke/project.myke" = {}
"~/.config/neovide/config.toml" = {}
"~/.config/ripgreprc" = {}
"~/.config/sheets/config.toml" = {}
"~/.config/starship.toml" = {}
"~/.config/vicinae/settings.json" = {}
"~/.config/whosthere/config.yaml" = {}
"~/.config/worktrunk/config.toml" = {}
"~/.config/yamlfix/yamlfix.toml" = {}
"~/.config/yamllint/config" = {}
