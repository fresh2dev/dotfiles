[settings]
# Disable mise auto-update
auto_update = false
# Pin versions in this file
pin = true
# Emit raw output from backend installers
raw = true
# Don't update tools released less than `minimum_release_age`
minimum_release_age = "0h"
# Default is `true`; disable to prevent shell expansion in env vars
env_shell_expand = true
# Dotfiles config
dotfiles.root = "~/.dotfiles"
dotfiles.default_mode = "symlink"

[settings.npm]
package_manager = "bun"

# [hooks]
# cd = "echo 'I changed directories'"
# enter = "echo 'I entered the project'"
# leave = "echo 'I left the project'"

[env]
XDG_CONFIG_HOME = "{{ env.HOME }}/.config"
# XDG_DATA_HOME = "{{ env.HOME }}/.local/share"
# XDG_CACHE_HOME = "{{ env.HOME }}/.cache"
# XDG_STATE_HOME = "{{ env.HOME }}/.local/state"

GIT_CONFIG_GLOBAL = "{{ env.HOME }}/.gitconfig"
RUSTUP_HOME = "{{ env.HOME }}/.rustup"
CARGO_HOME = "{{ env.HOME }}/.cargo"
BUN_INSTALL = "{{ env.HOME }}/.bun"
GOPATH = "{{ env.HOME }}/go"
GHQ_ROOT = "{{ env.HOME }}/sync/projects"

_.path = [
  "{{ env.HOME }}/.local/bin",
  "$CARGO_HOME/bin",
]

VISUAL = "nvim"
EDITOR = "nvim"

ZELLIJ_CONFIG_DIR = "$XDG_CONFIG_HOME/zellij"
GH_CONFIG_DIR = "$XDG_CONFIG_HOME/gh"
STARSHIP_CONFIG = "$XDG_CONFIG_HOME/starship.toml"
RIPGREP_CONFIG_PATH = "$XDG_CONFIG_HOME/ripgreprc"
YAMLFIX_CONFIG_PATH = "$XDG_CONFIG_HOME/yamlfix"
LG_CONFIG_FILE = "$XDG_CONFIG_HOME/lazygit/config.yml,$XDG_CONFIG_HOME/lazygit/theme.yml"
HOMEBREW_BREWFILE = "$XDG_CONFIG_HOME/brewfile/Brewfile"

FZF_DEFAULT_COMMAND = "rg --files"
FZF_DEFAULT_OPTS = "--bind alt-a:select-all,alt-d:deselect-all,ctrl-n:down,ctrl-p:up,ctrl-y:toggle-down,ctrl-space:toggle-down --layout=reverse"
_ZO_FZF_OPTS = "$FZF_DEFAULT_OPTS --border=none"
_ZO_EXCLUDE_DIRS = "/tmp:/var/*:/mnt/*"
_ZO_MAXAGE = 1000

[shell_alias]
ls = "lsd -a"
ll = "ls -la"
la = "ls -A"
lt = "ls --tree"
cat = "bat"
q = "exit"
g = "git"
so = "source"
v = "$VISUAL"
vq = "$VISUAL -c 'cbuffer | copen | wincmd p | bdelete! | cc'"
vg = "$EDITOR -c 'normal 1 go'"
v0 = "$EDITOR -c 'normal 1 0'"
fs = "$EDITOR -c 'normal 1 fs'"
ff = "$EDITOR -c 'normal 1 ff'"
fr = "$EDITOR -c 'normal 1 fr'"
mise-edit = "v ${MISE_CONFIG_DIR:-~/.config/mise}/config.toml"
"v." = "mise-edit"
zz = "ghq list --full-path | fzf --multi | sort -r | xargs -n1 zed --existing"
zj = "zellij"
lg = "lazygit"
kc = "kubectl"
cdt = "cd $(mktemp -d)"
currentmillis = "echo $(($(date +%s) * 1000))"
watch = "viddy"
less = "gum pager"
pause = "gum confirm 'Continue?'"
sshs = "purple"
jg = "just -g"
cld = "claude --dangerously-skip-permissions"
agyy = "agy --dangerously-skip-permissions"
scc = "tokei"  # "source code counter"
clear-color = 'fzf --ansi --no-sort --filter "^"'

# Single source of truth for CLI tools. `just apps update-mise` bumps the pins.
# Only things mise cannot install live in ~/.config/just/apps.just (brew casks,
# zsh plugin clones, zellij wasm plugins).
#
# Tools marked `lazy = true` (mise >= 2026.9.0) are skipped by a bare `mise install`
# and installed on first invocation via a bootstrap shim. `mise install --include-lazy`
# installs everything. Tools with no `bins` metadata in the mise registry, and every
# explicit backend (cargo:/go:/pypi:/npm:), must list their commands in `lazy_bins`
# or `mise reshim` fails. Run `mise reshim` after editing a lazy declaration by hand.
[tools]
# --- Languages / runtimes
python = "3.14.7"
go = "1.27.1"
node = "26.10.0"
rust = "1.98.1"
uv = "0.12.21"
cargo-binstall = "1.24.0"
bun = "1.4.2"
rust-analyzer = { version = "2026-09-28", lazy = true }
"cargo:cargo-edit" = { version = "0.13.13", lazy = true, lazy_bins = ["cargo-add", "cargo-rm", "cargo-upgrade", "cargo-set-version"] }
"npm:happy" = { version = "latest", lazy = true, lazy_bins = ["happy"] }
powershell = { version = "7.6.6", lazy = true, lazy_bins = ["pwsh"] }

# --- Shell / terminal
bat = "0.26.1"
direnv = "2.37.1"
fd = "10.5.0"
fzf = "0.74.4"
yq = "4.54.1"
jq = "1.8.2"
gum = "2.0.2"
just = "1.58.0"
lsd = "1.2.0"
ripgrep = "15.2.0"
starship = "1.26.0"
zellij = "0.45.1"
zoxide = "0.10.0"
viddy = { version = "1.3.1", lazy = true }
bottom = { version = "0.14.9", lazy = true, lazy_bins = ["btm"] }
"cargo:purple-ssh" = { version = "3.30.0", lazy = true, lazy_bins = ["purple"] }
"cargo:pastel" = { version = "0.12.0", lazy = true, lazy_bins = ["pastel"] }
hyperfine = { version = "1.20.0", lazy = true }
gping = { version = "1.21.0", lazy = true }
dua = { version = "2.45.0", lazy = true }
tokei = { version = "15.0.0", lazy = true, lazy_bins = ["tokei"] }
"go:github.com/knqyf263/pet" = { version = "1.0.1", lazy = true, lazy_bins = ["pet"] }
"go:github.com/maaslalani/sheets" = { version = "0.3.0", lazy = true, lazy_bins = ["sheets"] }

# --- Git
delta = "0.19.2"
lazygit = "0.65.1"
"cargo:git-graph" = "0.8.0"
"cargo:git-absorb" = "0.9.0"
github-cli = { version = "2.102.0", lazy = true, lazy_bins = ["gh"] }
"git-filter-repo" = { version = "2.47.0", lazy = true, lazy_bins = ["git-filter-repo"] }
"cargo:deadbranch" = { version = "0.4.0", lazy = true, lazy_bins = ["deadbranch"] }
"pypi:ghgrab" = { version = "2.1.0", lazy = true, lazy_bins = ["ghgrab"] }
"go:github.com/hjr265/gittop" = { version = "0.4.0", lazy = true, lazy_bins = ["gittop"] }
"cargo:drydock" = { version = "1.2.1", lazy = true, lazy_bins = ["drydock"] }

# --- Editors / LSP / formatters / linters
neovim = "0.12.5"
luajit = "2.1.1744318430"
"pypi:neovim-remote" = "2.5.1"
# Force tree-sitter-cli to install without `cargo-binstall` so it compiles against the current glibc version.
"cargo:tree-sitter-cli" = { version = "0.27.0", default-features = false }
"cargo:stylua" = { version = "2.5.2", features = "luajit", lazy = true, lazy_bins = ["stylua"] }
"aqua:numtide/treefmt" = "2.6.0"
rumdl = "0.2.78"
shfmt = { version = "3.14.1", lazy = true }
tombi = { version = "1.6.0", lazy = true }
lua-language-server = { version = "3.19.1", lazy = true }
"pypi:just-lsp" = "0.10.0"
copier = { version = "9.18.2", lazy = true }
prek = "0.5.4"
typos = { version = "1.50.3", lazy = true, lazy_bins = ["typos"] }
shellcheck = { version = "0.11.0", lazy = true, lazy_bins = ["shellcheck"] }
"cargo:shellharden" = { version = "4.3.2", lazy = true, lazy_bins = ["shellharden"] }
dotenv-linter = { version = "4.0.0", lazy = true, lazy_bins = ["dotenv-linter"] }
"npm:bash-language-server" = { version = "5.8.1", lazy = true, lazy_bins = ["bash-language-server"] }
"cargo:typos-lsp" = { version = "0.1.56", lazy = true, lazy_bins = ["typos-lsp"] }
yamllint = { version = "1.38.0", lazy = true }
"pypi:yamlfix" = { version = "1.19.1", lazy = true, lazy_bins = ["yamlfix"] }
"pypi:beautysh" = { version = "6.4.3", lazy = true, lazy_bins = ["beautysh"] }
"pypi:mdformat" = { version = "1.0.0", uvx_args = "--with mdformat-footnote --with mdformat-front-matters --with mdformat-ruff --with mdformat-gfm --with mdformat-lists --with mdformat-beautysh --with mdformat-simple-breaks --with mdformat-web --with mdformat-wikilink", lazy = true, lazy_bins = ["mdformat"] }

# --- Python
ruff = { version = "0.16.9", lazy = true }
ty = { version = "0.0.84", lazy = true }
"pypi:basedpyright" = { version = "1.40.1", lazy = true, lazy_bins = ["basedpyright", "basedpyright-langserver"] }
"pypi:pyrefly" = { version = "1.3.2", lazy = true, lazy_bins = ["pyrefly"] }
"pypi:zuban" = { version = "0.10.0", lazy = true, lazy_bins = ["zuban", "zmypy"] }

# --- Go
"go:golang.org/x/tools/gopls" = { version = "0.23.0", lazy = true, lazy_bins = ["gopls"] }
"go:golang.org/x/tools/cmd/goimports" = { version = "0.50.0", lazy = true, lazy_bins = ["goimports"] }
gofumpt = { version = "0.12.0", lazy = true }
staticcheck = { version = "2026.2.1", lazy = true }

# --- Kubernetes / containers
kubectl = { version = "1.37.1", lazy = true }
kubectx = { version = "0.11.0", lazy = true, lazy_bins = ["kubectx", "kubens"] }
k9s = { version = "0.51.0", lazy = true }
k3d = { version = "5.9.0", lazy = true }
stern = { version = "1.34.0", lazy = true }
helm = { version = "4.3.0", lazy = true }
helmwave = { version = "0.44.4", lazy = true }
"npm:cdk8s-cli" = { version = "2.207.63", lazy = true, lazy_bins = ["cdk8s"] }
docker-cli = { version = "29.8.1", lazy = true }
docker-compose = { version = "5.5.1", lazy = true }

"pypi:markitdown" = { version = "0.1.8", extras = "pdf,audio-transcription,youtube-transcription", lazy = true, lazy_bins = ["markitdown"] }
pandoc = { version = "3.12", lazy = true }
zola = { version = "0.23.6", lazy = true }
hugo = { version = "0.167.0", lazy = true }
gomplate = { version = "5.2.0", lazy = true }

ffmpeg = { version = "9.0.2", lazy = true }
exiftool = { version = "13.59", lazy = true }
yt-dlp = { version = "2026.08.19", rename_exe = "yt-dlp", lazy = true }

# --- LLM
claude = { version = "2.1.285", lazy = true }
"cargo:cship" = { version = "1.8.3", lazy = true, lazy_bins = ["cship"] }
"github:Dicklesworthstone/beads_rust" = { version = "0.7.3", lazy = true, lazy_bins = ["br"] }
"github:Dicklesworthstone/beads_viewer" = { version = "0.25.1", lazy = true, lazy_bins = ["bv"] }
"npm:ralph-tui" = { version = "0.12.0", lazy = true, lazy_bins = ["ralph-tui"] }
"npm:skills" = { version = "1.7.0", lazy = true, lazy_bins = ["skills"] }
hunk = { version = "0.22.0", lazy = true, lazy_bins = ["hunk"] }

# --- Network / Security
mkcert = { version = "1.4.4", lazy = true }
"go:github.com/yutat23/lsoff" = { version = "0.1.5", lazy = true, lazy_bins = ["lsoff"] }
"go:github.com/ramonvermeulen/whosthere" = { version = "0.9.0", lazy = true, lazy_bins = ["whosthere"] }
bitwarden-secrets-manager = { version = "latest", lazy = true }
ghq = "1.11.2"
"npm:@ticktick/ticktick-cli" = "0.1.14"

