[settings]
# Disable mise auto-update
auto_update = false
# Pin versions in this file
pin = true
# Emit raw output from backend installers
raw = true
# Don't update tools released less than `minimum_release_age`
minimum_release_age = "0h"
# Default is `true`; disable to prevent shell expansion in env vars
env_shell_expand = true
# Dotfiles config
dotfiles.root = "~/.dotfiles"
dotfiles.default_mode = "symlink"

[settings.npm]
package_manager = "bun"

# [hooks]
# cd = "echo 'I changed directories'"
# enter = "echo 'I entered the project'"
# leave = "echo 'I left the project'"

[env]
XDG_CONFIG_HOME = "{{ env.HOME }}/.config"
# XDG_DATA_HOME = "{{ env.HOME }}/.local/share"
# XDG_CACHE_HOME = "{{ env.HOME }}/.cache"
# XDG_STATE_HOME = "{{ env.HOME }}/.local/state"

GIT_CONFIG_GLOBAL = "{{ env.HOME }}/.gitconfig"
RUSTUP_HOME = "{{ env.HOME }}/.rustup"
CARGO_HOME = "{{ env.HOME }}/.cargo"
BUN_INSTALL = "{{ env.HOME }}/.bun"
GOPATH = "{{ env.HOME }}/go"
GHQ_ROOT = "{{ env.HOME }}/sync/projects"

_.path = ["{{ env.HOME }}/.local/bin", "/opt/homebrew/bin", "$GOPATH/bin"]

VISUAL = "nvim"
EDITOR = "nvim"

ZELLIJ_CONFIG_DIR = "$XDG_CONFIG_HOME/zellij"
ZELLIJ_SOCKET_DIR = "/tmp/zellij-{{ exec(command='id -u') }}"
GH_CONFIG_DIR = "$XDG_CONFIG_HOME/gh"
STARSHIP_CONFIG = "$XDG_CONFIG_HOME/starship.toml"
RIPGREP_CONFIG_PATH = "$XDG_CONFIG_HOME/ripgreprc"
YAMLFIX_CONFIG_PATH = "$XDG_CONFIG_HOME/yamlfix"
LG_CONFIG_FILE = "$XDG_CONFIG_HOME/lazygit/config.yml,$XDG_CONFIG_HOME/lazygit/theme.yml"
FZF_DEFAULT_OPTS_FILE = "$XDG_CONFIG_HOME/fzf/fzfrc"
FZF_DEFAULT_COMMAND = "rg --files"
# Added to FZF_DEFAULT_OPTS_FILE.
_ZO_FZF_OPTS = "--border=none --no-sort"
_ZO_EXCLUDE_DIRS = "/tmp/*:/private/tmp/*:/var/*:/mnt/*"
_ZO_MAXAGE = 1000

[shell_alias]
ls = "lsd -a"
ll = "ls -la"
la = "ls -A"
lt = "ls --tree"
cat = "bat"
q = "exit"
g = "git"
so = "source"
v = "$VISUAL"
vq = "$VISUAL -c 'cbuffer | copen | wincmd p | bdelete! | cc'"
vg = "$EDITOR -c 'normal 1 go'"
v0 = "$EDITOR -c 'normal 1 0'"
fs = "$EDITOR -c 'normal 1 fs'"
ff = "$EDITOR -c 'normal 1 ff'"
fr = "$EDITOR -c 'normal 1 fr'"
zz = "ghq list --full-path | fzf --multi | sort -r | xargs -n1 zed --existing"
zj = "zellij"
j = "just"
lg = "lazygit"
kc = "kubectl"
cdt = "cd $(mktemp -d)"
currentmillis = "echo $(($(date +%s) * 1000))"
watch = "viddy --shell $SHELL"
less = "gum pager"
pause = "gum confirm 'Continue?'"
sshs = "purple"
jg = "just -g"
cld = "claude --dangerously-skip-permissions"
agyy = "agy --dangerously-skip-permissions"
scc = "tokei"  # "source code counter"
clear-color = 'fzf --ansi --no-sort --filter "^"'

# [tasks]
# pre_bootstrap = [
#   "mkdir -p ${XDG_CONFIG_HOME}",
#   "mkdir -p ${ZELLIJ_CONFIG_DIR}/plugins",
# ]

# valid phases are: pre-packages, post-packages, pre-repos, post-repos, pre-dotfiles, post-dotfiles, pre-defaults, post-defaults, pre-user, post-user, pre-tools, post-tools, final
[bootstrap.hooks.pre-tools]
run = [
  'mkdir -p "$HOME/.local/bin"',
  'mkdir -p "${XDG_CONFIG_HOME}"',
  'mkdir -p "${ZELLIJ_CONFIG_DIR}/plugins"',
]

[bootstrap.hooks.post-tools]
run = [
  # "nvim --headless -c 'lua vim.pack.update()' -c 'qa'",
]

[tools]
# --- Languages / runtimes
python = "3.14.8"
go = "1.27.1"
node = "26.10.0"
rust = "1.99.0"
uv = "0.12.23"
cargo-binstall = "1.25.2"
bun = "1.4.2"
ruby = "4.0.7"
rust-analyzer = { version = "2026-10-05", lazy = true }
"cargo:cargo-edit" = { version = "0.13.13", lazy = true, lazy_bins = ["cargo-add", "cargo-rm", "cargo-upgrade", "cargo-set-version"] }
"npm:happy" = { version = "latest", lazy = true, lazy_bins = ["happy"] }
powershell = { version = "7.6.6", lazy = true, lazy_bins = ["pwsh"] }

# --- Shell / terminal
