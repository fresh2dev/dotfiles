coreutils = { version = "0.12.0", postinstall = 'bin="$(find "$MISE_TOOL_INSTALL_PATH" -type f -name coreutils)" && "$bin" --list | xargs -I{} ln -sf "$bin" "$HOME/.local/bin/{}"' }
bat = "0.26.1"
direnv = "2.38.1"
fd = "10.5.0"
fzf = "0.74.4"
yq = "4.54.1"
jq = "1.8.2"
gum = "2.0.2"
just = "1.58.0"
lsd = "1.2.0"
ripgrep = "15.2.0"
starship = "1.26.0"
zellij = "0.45.1"
zoxide = "0.10.0"
viddy = { version = "1.3.1", lazy = true }
bottom = { version = "0.14.9", lazy = true, lazy_bins = ["btm"] }
"cargo:purple-ssh" = { version = "3.30.0", lazy = true, lazy_bins = ["purple"] }
"cargo:pastel" = { version = "0.12.0", lazy = true, lazy_bins = ["pastel"] }
gping = { version = "1.21.0", lazy = true }
"cargo:hyperfine" = { version = "1.21.0", lazy = true, lazy_bins = ["hyperfine"] }
