# Run Syncthing (`brew:syncthing` above) at login, replacing `brew services start syncthing`.
[bootstrap.services.syncthing]
scope = "user"
description = "Syncthing"
command = "/opt/homebrew/opt/syncthing/bin/syncthing --no-browser --no-restart"

# Set PATH, XDG_CONFIG_HOME and XDG_DATA_DIRS for GUI apps not started from a terminal
# (Finder, Dock, Spotlight), for the current user only, so they find tools such as
# mise-managed `ffmpeg`, read their config from ~/.config, and find Homebrew's share dir
# like a shell does. PATH uses mise shims, not install dirs, so it survives version bumps.
# Only apps launched after the agent runs see the values; relaunch open apps.
[bootstrap.macos.launchd.agents.mise-env]
program = "/bin/launchctl"
args = [
  "setenv",
  "PATH",
  "{{ env.HOME }}/.local/share/mise/shims:{{ env.HOME }}/.local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin",
  "XDG_CONFIG_HOME",
  "{{ env.HOME }}/.config",
  "XDG_DATA_DIRS",
  "/opt/homebrew/share:/usr/local/share:/usr/share",
]
run_at_load = true

[bootstrap.macos.dock]
autohide = true
orientation = "left"
tilesize = 36
show_recents = false

[bootstrap.macos.finder]
show_all_files = true
show_pathbar = true
preferred_view_style = "list"

# valid phases are: pre-packages, post-packages, pre-repos, post-repos, pre-dotfiles, post-dotfiles, pre-defaults, post-defaults, pre-user, post-user, pre-tools, post-tools, final
[bootstrap.hooks.post-packages]
run = [
  'ln -sfn "/Applications/Dropshare 6.app/Contents/Resources/ds.sh" "$HOME/.local/bin/dropshare"',
]

# Restart the Dock and Finder so the Dock and Finder defaults above take effect. Both are
# launchd agents in the GUI domain, so let launchd restart them (`kickstart -k` stops the
# running instance and starts a new one) instead of `killall`. `|| true` because there
# is no GUI domain outside a desktop session (e.g. over SSH), and a failed restart
# shouldn't stop bootstrap.
[bootstrap.hooks.post-defaults]
run = [
  'launchctl kickstart -k "gui/$(id -u)/com.apple.Dock.agent" || true',
  'launchctl kickstart -k "gui/$(id -u)/com.apple.Finder" || true',
]
