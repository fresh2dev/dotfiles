# Run Syncthing (`brew:syncthing` above) at login, replacing `brew services start syncthing`.
[bootstrap.services.syncthing]
scope = "user"
description = "Syncthing"
command = "/opt/homebrew/opt/syncthing/bin/syncthing --no-browser --no-restart"

# Publish the `[env]` table from ~/.config/mise/config.toml to launchd, so GUI apps not
# started from a terminal see the same XDG_*, EDITOR, ... values as a shell. PATH is
# skipped. Only processes launched afterwards see the values; relaunch open apps.
# Written to ~/Library/LaunchAgents/dev.mise.mise-env.plist; re-run with
# `launchctl kickstart -k gui/$(id -u)/dev.mise.mise-env`.
[bootstrap.macos.launchd.agents.mise-env]
program = "/bin/sh"
args = [
  "-c",
  '''
MISE_CONFIG_DIR="${HOME}/.config/mise" "${HOME}/.local/bin/mise" env ls --dotenv \
  | while IFS='=' read -r name value; do
      launchctl setenv "$name" "$value"
    done
''',
]
run_at_load = true
stderr_path = "/tmp/mise-env.log"

[bootstrap.macos.dock]
autohide = true
orientation = "left"
tilesize = 36
show_recents = false

[bootstrap.macos.finder]
show_all_files = true
show_pathbar = true
preferred_view_style = "list"

# # valid phases are: pre-packages, post-packages, pre-repos, post-repos, pre-dotfiles, post-dotfiles, pre-defaults, post-defaults, pre-user, post-user, pre-tools, post-tools, final
[bootstrap.hooks.post-defaults]
run = [
  "killall Dock || true",
  "killall Finder || true",
]
