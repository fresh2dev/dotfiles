# Scene theme for k9s. Scene rewrites this file on every apply.
k9s:
  body:
    fgColor: "#dad3e9"
    bgColor: default
    logoColor: "#f252d8"
  prompt:
    fgColor: "#dad3e9"
    bgColor: "#10091a"
    suggestColor: "#ebbf0d"
  info:
    fgColor: "#f252d8"
    sectionColor: "#dad3e9"
  dialog:
    fgColor: "#dad3e9"
    bgColor: default
    buttonFgColor: "#dad3e9"
    buttonBgColor: "#67aaff"
    buttonFocusFgColor: "#10091a"
    buttonFocusBgColor: "#f252d8"
    labelFgColor: "#85799e"
    fieldFgColor: "#dad3e9"
  frame:
    border:
      fgColor: "#413755"
      focusColor: "#f252d8"
    menu:
      fgColor: "#dad3e9"
      keyColor: "#65d86d"
      numKeyColor: "#65d86d"
    crumbs:
      fgColor: "#10091a"
      bgColor: "#f252d8"
      activeColor: "#65d86d"
    status:
      newColor: "#f252d8"
      modifyColor: "#67aaff"
      addColor: "#65d86d"
      errorColor: "#ff796d"
      highlightColor: "#ebbf0d"
      killColor: "#85799e"
      completedColor: "#85799e"
    title:
      fgColor: "#dad3e9"
      bgColor: default
      highlightColor: "#f252d8"
      counterColor: "#65d86d"
      filterColor: "#65d86d"
  views:
    charts:
      bgColor: default
      defaultDialColors:
        - "#f252d8"
        - "#65d86d"
      defaultChartColors:
        - "#f252d8"
        - "#65d86d"
    table:
      fgColor: "#dad3e9"
      bgColor: default
      cursorFgColor: "#dad3e9"
      cursorBgColor: "#150e21"
      markColor: "#ebbf0d"
      header:
        fgColor: "#dad3e9"
        bgColor: default
        sorterColor: "#f252d8"
    xray:
      fgColor: "#dad3e9"
      bgColor: default
      cursorColor: "#150e21"
      graphicColor: "#f252d8"
      showIcons: false
    yaml:
      keyColor: "#f252d8"
      colonColor: "#67aaff"
      valueColor: "#dad3e9"
    logs:
      fgColor: "#dad3e9"
      bgColor: default
      indicator:
        fgColor: "#dad3e9"
        bgColor: "#3c1b35"
    help:
      fgColor: "#dad3e9"
      bgColor: default
      indicator:
        fgColor: "#65d86d"
        bgColor: "#3c1b35"
