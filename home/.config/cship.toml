[cship]
lines = [
  """
  $directory\
  $git_branch\
  $git_status
  """,
  "$cship.model [ $cship.effort ] $cship.agent $cship.context_bar $cship.usage_limits $cship.peak_usage",
]

[cship.model]
symbol = ""
style = "bold cyan"

[cship.agent]
symbol = "↳ "
style = "fg:#9ece6a"

# [cship.effort]
# symbol      = "⚡"
# style       = "fg:#7dcfff"
# high_style  = "fg:#e0af68"
# xhigh_style = "bold fg:#e0af68"
# max_style   = "bold fg:#f7768e"

[cship.context_bar]
width = 10
style = "fg:#7dcfff"
warn_threshold = 40.0
warn_style = "fg:#e0af68"
critical_threshold = 70.0
critical_style = "bold fg:#f7768e"

[cship.usage_limits]
five_hour_format = " 5h {pct}% ({reset})"
seven_day_format = " 7d {pct}% ({reset})"
separator = " "
warn_threshold = 50.0
warn_style = "fg:#e0af68"
critical_threshold = 80.0
critical_style = "bold fg:#f7768e"
