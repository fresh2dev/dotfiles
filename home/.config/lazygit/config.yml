# Config relating to the Lazygit UI
gui:
  # Custom icons for filenames and file extensions
  # See https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md#custom-files-icon--color
  customIcons:
    # Map of filenames to icon properties (icon and color)
    filenames: {}

    # Map of file extensions (including the dot) to icon properties (icon and color)
    extensions: {}

  # The number of lines you scroll by when scrolling the main window
  scrollHeight: 2

  # If true, allow scrolling past the bottom of the content in the main window
  scrollPastBottom: true

  # See https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md#scroll-off-margin
  scrollOffMargin: 2

  # One of: 'margin' (default) | 'jump'
  scrollOffBehavior: 'margin'

  # The number of spaces per tab; used for everything that's shown in the main
  # view, but probably mostly relevant for diffs.
  # Note that when using a diff renderer, the renderer has its own tab width
  # setting, so you need to pass it separately in the renderer command.
  tabWidth: 2

  # If true, capture mouse events.
  # When mouse events are captured, it's a little harder to select text: e.g.
  # requiring you to hold the option key when on macOS.
  mouseEvents: true

  # If true, do not show a warning when amending a commit.
  skipAmendWarning: false

  # If true, do not show a warning when discarding changes from a focused diff.
  skipDiscardChangeWarning: false

  # If true, do not show warning when applying/popping the stash
  skipStashWarning: false

  # If true, do not show a warning when attempting to commit without any staged
  # files; instead stage all unstaged files.
  skipNoStagedFilesWarning: false

  # If true, do not show a warning when rewording a commit via an external editor
  skipRewordInEditorWarning: true

  # If true, switch to a different worktree without confirmation when checking out
  # a branch that is checked out in that worktree
  skipSwitchWorktreeOnCheckoutWarning: false

  # Fraction of the total screen width to use for the left side section. You may
  # want to pick a small number (e.g. 0.2) if you're using a narrow screen, so
  # that you can see more of the main section.
  # Number from 0 to 1.0.
  sidePanelWidth: 0.4

  # If true, increase the height of the focused side window; creating an accordion
  # effect.
  expandFocusedSidePanel: true

  # The weight of the expanded side panel, relative to the other panels. 2 means
  # twice as tall as the other panels. Only relevant if `expandFocusedSidePanel`
  # is true.
  expandedSidePanelWeight: 4

  # If true, don't give a side panel more height than it needs to show its
  # content; when all panels fit, the leftover height is shared among them so that
  # they still fill the screen.
  shrinkSidePanelsToContent: true

  # The side panels, in the order they appear from top to bottom.
  # Each entry is a list of one or more names that share a single panel as tabs
  # (cycle through them with the next-tab/previous-tab keys).
  # Omit a name to hide it; give a name its own one-element list to promote a tab
  # to a top-level panel.
  # Valid names are: 'status', 'files', 'worktrees', 'submodules', 'branches',
  # 'remotes', 'tags', 'commits', 'reflog', 'stash'. 'files', 'branches', and
  # 'commits' must always be included; they can't be hidden.
  sidePanels:
    - [status]
    - [worktrees, branches, remotes, tags]
    - [files, submodules]
    - [commits, reflog]
    - [stash]


  # Sometimes the main window is split in two (e.g. when the selected file has
  # both staged and unstaged changes). This setting controls how the two sections
  # are split.
  # Options are:
  # - 'horizontal': split the window horizontally
  # - 'vertical': split the window vertically
  # - 'flexible': (default) split the window horizontally if the window is wide
  # enough, otherwise split vertically
  mainPanelSplitMode: flexible

  # How the window is split when in half screen mode (i.e. after hitting '+'
  # once).
  # Possible values:
  # - 'left': split the window horizontally (side panel on the left, main view on
  # the right)
  # - 'top': split the window vertically (side panel on top, main view below)
  enlargedSideViewLocation: top

  # Only applicable when `enlargedSideViewLocation: 'left'`
  halfScreenSidePanelWidth: 0.5

  # If true, wrap lines in focused diffs to the width of the view. This makes it
  # much easier to work with diffs that have long lines, e.g. paragraphs of
  # markdown text.
  # If false, scroll a focused diff sideways with the scrollLeft and scrollRight
  # keys (H and L by default).
  wrapLinesInDiffView: true

  # If true, hunk selection mode will be enabled by default when focusing a diff.
  useHunkModeInDiffView: true

  # One of 'auto' (default) | 'en' | 'zh-CN' | 'zh-TW' | 'pl' | 'nl' | 'ja' | 'ko'
  # | 'ru' | 'pt'
  language: en

  # Format used when displaying time e.g. commit time.
  # Uses Go's time format syntax: https://pkg.go.dev/time#Time.Format
  timeFormat: 02 Jan 06

  # Format used when displaying time if the time is less than 24 hours ago.
  # Uses Go's time format syntax: https://pkg.go.dev/time#Time.Format
  shortTimeFormat: 3:04PM

  # Whether the terminal has a dark or a light background. This decides whether
  # 'darkTheme' or 'lightTheme' applies, and the colors of authors are picked to
  # stand out against it.
  # One of: 'auto' (default) | 'dark' | 'light'
  # With 'auto', lazygit asks the terminal, and assumes a dark background if the
  # terminal doesn't tell.
  colorScheme: dark

  # Config relating to colors and styles.
  # See https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md#color-attributes
  theme: {}
  # Config relating to the commit length indicator
  commitLength:
    # If true, show an indicator of commit message length
    show: true

  # If true, show the '5 of 20' footer at the bottom of list views
  showListFooter: true

  # If true, display the files in the file views as a tree. If false, display the
  # files as a flat list.
  # This can be toggled from within Lazygit with the '`' key, but that will not
  # change the default.
  showFileTree: false

  # If true, add a "/" root item in the file tree representing the root of the
  # repository. It is only added when necessary, i.e. when there is more than one
  # item at top level.
  showRootItemInFileTree: true

  # How to sort files and directories in the file tree.
  # One of: 'mixed' (default) | 'filesFirst' | 'foldersFirst'
  fileTreeSortOrder: 'filesFirst'

  # If true (default), sort the file tree case-sensitively.
  fileTreeSortCaseSensitive: true

  # If true, show the number of lines changed per file in the Files view
  showNumstatInFilesView: true

  # If true, show a random tip in the command log when Lazygit starts
  showRandomTip: false

  # If true, show the command log
  showCommandLog: false

  # If true, show the bottom line that contains keybinding info and useful
  # buttons. If false, this line will be hidden except to display a loader for an
  # in-progress action.
  showBottomLine: true

  # If true, show jump-to-window keybindings in window titles.
  showPanelJumps: true

  # Nerd fonts version to use.
  # One of: '2' | '3' | empty string (default)
  # If empty, do not show icons.
  nerdFontsVersion: '3'

  # If true (default), file icons are shown in the file views. Only relevant if
  # NerdFontsVersion is not empty.
  showFileIcons: true

  # How the commit graph is drawn.
  # One of: 'auto' (default) | 'classic' | 'detailed'
  # 'detailed' connects the lines to the commit circles, and shows exactly where
  # branches fork off and merge. It draws the graph with the git branch drawing
  # symbols (U+F5D0 to U+F60D), so it needs a terminal that draws these itself:
  # kitty, Ghostty, WezTerm (nightly builds), Contour, or VS Code's terminal with
  # GPU acceleration. Other terminals need a font that contains them, such as
  # https://github.com/rbong/flog-symbols.
  # 'auto' uses 'detailed' if lazygit recognizes the terminal as one that draws
  # these symbols (kitty and Ghostty), and 'classic' otherwise.
  commitGraphStyle: detailed

  # Length of author name in (non-expanded) commits view. 2 means show initials
  # only.
  commitAuthorShortLength: 2

  # Length of author name in expanded commits view. 2 means show initials only.
  commitAuthorLongLength: 17

  # Length of commit hash in commits view. 0 shows '*' if NF icons aren't on.
  commitHashLength: 8

  # If true, show commit hashes alongside branch names in the branches view.
  showBranchCommitHash: false

  # Whether to show the divergence from the base branch in the branches view.
  # One of: 'none' | 'onlyArrow'  | 'arrowAndNumber'
  showDivergenceFromBaseBranch: 'arrowAndNumber'

  # Height of the command log view
  commandLogSize: 8

  # Whether to split the main window when viewing file changes.
  # One of: 'auto' | 'always'
  # If 'auto', only split the main window when a file has both staged and unstaged
  # changes
  splitDiff: 'auto'

  # Default size for focused window. Can be changed from within Lazygit with '+'
  # and '_' (but this won't change the default).
  # One of: 'normal' (default) | 'half' | 'full'
  screenMode: 'normal'

  # Window border style.
  # One of 'rounded' (default) | 'single' | 'double' | 'hidden' | 'bold'
  border: 'rounded'

  # If true, show a seriously epic explosion animation when nuking the working
  # tree.
  animateExplosion: true

  # Whether to stack UI components on top of each other.
  # One of 'auto' (default) | 'always' | 'never'
  portraitMode: auto

  # In 'auto' mode, portrait mode will be used if the window width is less than or
  # equal to portraitModeAutoMaxWidth and the window height is greater than or
  # equal to portraitModeAutoMinHeight. Unused when portraitMode is not 'auto'.
  portraitModeAutoMaxWidth: 84

  # In 'auto' mode, portrait mode will be used if the window width is less than or
  # equal to portraitModeAutoMaxWidth and the window height is greater than or
  # equal to portraitModeAutoMinHeight. Unused when portraitMode is not 'auto'.
  portraitModeAutoMinHeight: 46

  # How things are filtered when typing '/'.
  # One of 'substring' (default) | 'fuzzy'
  filterMode: substring
  # Config relating to the spinner.
  spinner:
    # The frames of the spinner animation.
    frames:
      - ●∙∙
      - ∙●∙
      - ∙∙●
      - ∙●∙

    # The "speed" of the spinner in milliseconds.
    rate: 180

  # Status panel view.
  # One of 'dashboard' (default) | 'allBranchesLog'
  statusPanelView: 'allBranchesLog'

  # If true, jump to the Files panel after popping a stash
  switchToFilesAfterStashPop: true

  # If true, jump to the Files panel after applying a stash
  switchToFilesAfterStashApply: true

  # If true, when using the panel jump keys (default 1 through 5) and target panel
  # is already active, go to next tab instead
  switchTabsWithPanelJumpKeys: false

# Config relating to git
git:
  # Array of diff renderers. Each entry has the following format:
  #
  #   # The type of diff renderer. One of: 'stdinFilter' (default) | 'extDiff'
  #   # | 'rawGit'
  #   type: "stdinFilter"
  #
  #   # A name for the diff renderer, shown in the notification when cycling
  #   # renderers. If not set, the name is derived from the first word of the
  #   # renderer command.
  #   name: ""
  #
  #   # Value of the --color arg in the git diff command. Only used for type
  #   # 'stdinFilter'. Some renderers want this to be set to 'always' and some
  #   # want it set to 'never'.
  #   colorArg: "always"
  #
  #   # The command to use for rendering diffs. This is either a stdinFilter or
  #   # an external diff command, depending on the type field; not applicable if
  #   # the type is 'rawGit'.
  #   # e.g.
  #   # diff-so-fancy
  #   # delta --dark --paging=never
  #   # ydiff -p cat
  #   # difft --color=always
  #   command: ""
  #
  #   # Extra arguments (array of strings) passed to the git command. Only
  #   # applicable if the type is 'rawGit'.
  #   args: []
  #
  # See https://github.com/jesseduffield/lazygit/blob/master/docs/Custom_DiffRenderers.md
  # for more information.
  diffRenderers:
    # Value of the --color arg in the git diff command. Some pagers want this to be set to 'always' and some want it set to 'never'
    - colorArg: 'always'
      command: 'delta --paging=never'
      useConfig: false
      # # e.g. 'difft --color=always'
      # externalDiffCommand: ''
  # Config relating to committing
  commit:
    # If true, pass '--signoff' flag when committing
    signOff: false

    # Automatic WYSIWYG wrapping of the commit message as you type
    autoWrapCommitMessage: true

    # If autoWrapCommitMessage is true, the width to wrap to
    autoWrapWidth: 72

  # Config relating to merging
  merging:
    # If true, run merges in a subprocess so that if a commit message is required,
    # Lazygit will not hang
    # Only applicable to unix users.
    manualCommit: false

    # Extra args passed to `git merge`, e.g. --no-ff
    args: "--no-ff"

    # The commit message to use for a squash merge commit. Can contain
    # "{{selectedRef}}" and "{{currentBranch}}" placeholders.
    squashMergeMessage: Squash merge {{selectedRef}} into {{currentBranch}}

  # list of branches that are considered 'main' branches, used when displaying
  # commits
  mainBranches:
    - master
    - main

  # Prefix to use when skipping hooks. E.g. if set to 'WIP', then pre-commit hooks
  # will be skipped when the commit message starts with 'WIP'
  skipHookPrefix: WIP

  # If true, periodically fetch from remote
  autoFetch: true

  # If true, periodically refresh files and submodules
  autoRefresh: true

  # If true, poll the repo periodically for external ref changes (commits, branch
  # updates, checkouts made outside lazygit) and refresh when one is detected.
  # Independent of autoRefresh, which only governs the files panel.
  autoDetectExternalChanges: true

  # If not "none", lazygit will automatically fast-forward local branches to match
  # their upstream after fetching. Applies to branches that are not the currently
  # checked out branch, and only to those that are strictly behind their upstream
  # (as opposed to diverged). A branch that is checked out in another worktree is
  # fast-forwarded there, unless that worktree has changes to tracked files or is
  # in the middle of a rebase or bisect.
  # Possible values: 'none' | 'onlyMainBranches' | 'allBranches'
  autoForwardBranches: onlyMainBranches

  # If true, pass the --all arg to git fetch
  fetchAll: true

  # If true, lazygit will automatically stage files that used to have merge
  # conflicts but no longer do; and it will also ask you if you want to continue a
  # merge or rebase if you've resolved all conflicts. If false, it won't do either
  # of these things.
  autoStageResolvedConflicts: true

  # Command used when displaying the current branch git log in the main window
  branchLogCmd: git log --graph --color=always --abbrev-commit --decorate --date=relative --pretty=medium {{branchName}} --

  # Commands used to display git log of all branches in the main window, they will
  # be cycled in order of appearance (array of strings)
  allBranchesLogCmds:
    ## Pretty graph with: https://github.com/git-bahn/git-graph
    - git-graph
    - git log --graph --all --color=always --abbrev-commit --decorate --date=relative  --pretty=medium

  # If true, git diffs are rendered with the `--ignore-all-space` flag, which
  # ignores whitespace changes. Can be toggled from within Lazygit with
  # `<ctrl+w>`.
  ignoreWhitespaceInDiffView: false

  # The number of lines of context to show around each diff hunk. Can be changed
  # from within Lazygit with the `{` and `}` keys.
  diffContextSize: 3

  # The threshold for considering a file to be renamed, in percent. Can be changed
  # from within Lazygit with the `(` and `)` keys.
  renameSimilarityThreshold: 50

  # If true, do not spawn a separate process when using GPG
  overrideGpg: false

  # If true, do not allow force pushes
  disableForcePushing: false

  # See https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md#predefined-commit-message-prefix
  commitPrefix: []

  # See https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md#predefined-commit-message-prefix
  commitPrefixes: {}

  # See https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md#predefined-branch-name-prefix
  branchPrefix: ""

  # If true, parse emoji strings in commit messages e.g. render :rocket: as 🚀
  # (This should really be under 'gui', not 'git')
  parseEmoji: false

  # Config for showing the log in the commits view
  log:
    # One of: 'date-order' | 'author-date-order' | 'topo-order' | 'default'
    # 'topo-order' makes it easier to read the git log graph, but commits may not
    # appear chronologically. See https://git-scm.com/docs/
    #
    # Can be changed from within Lazygit with `Log menu -> Commit sort order`
    # (`<ctrl+l>` in the commits window by default).
    order: topo-order

    # This determines whether the git graph is rendered in the commits panel
    # One of 'always' | 'never' | 'when-maximised'
    #
    # Can be toggled from within lazygit with `Log menu -> Show git graph`
    # (`<ctrl+l>` in the commits window by default).
    showGraph: always

    # displays the whole git graph by default in the commits view (equivalent to
    # passing the `--all` argument to `git log`)
    showWholeGraph: false

  # How branches are sorted in the local branches view.
  # One of: 'date' (default) | 'recency' | 'alphabetical'
  # Can be changed from within Lazygit with the Sort Order menu (`s`) in the
  # branches panel.
  localBranchSortOrder: date

  # How branches are sorted in the remote branches view.
  # One of: 'date' (default) | 'alphabetical'
  # Can be changed from within Lazygit with the Sort Order menu (`s`) in the
  # remote branches panel.
  remoteBranchSortOrder: date

  # When copying commit hashes to the clipboard, truncate them to this length. Set
  # to 40 to disable truncation.
  truncateCopiedCommitHashesTo: 12

# # Config relating to git worktrees
# worktree:
#   # Default parent directory for new worktrees. It is offered as a candidate
#   # location alongside the parent directories of any worktrees you already have.
#   # A relative path is resolved against the repository's root directory, so
#   # "../worktrees" sits beside the repo and ".worktrees" sits inside it.
#   # A leading "~" is expanded to your home directory, so "~/worktrees" works.
#   defaultPath: "../<PROJECT>.wt/"

# Periodic update checks
update:
  # One of: 'prompt' (default) | 'background' | 'never'
  method: 'never'

  # Period in days between update checks
  days: 14

# Background refreshes
refresher:
  # File/submodule refresh interval in seconds.
  # Auto-refresh can be disabled via option 'git.autoRefresh'.
  refreshInterval: 5

  # Re-fetch interval in seconds.
  # Auto-fetch can be disabled via option 'git.autoFetch'.
  fetchInterval: 300

  # Interval in seconds at which lazygit polls for external ref changes (commits,
  # branch updates, checkouts made outside lazygit).
  # Detection can be disabled via option 'git.autoDetectExternalChanges'.
  externalChangeCheckInterval: 2

# If true, show a confirmation popup before quitting Lazygit
confirmOnQuit: false

# If true, exit Lazygit when the user presses escape in a context where there is
# nothing to cancel/close
quitOnTopLevelReturn: false

# Config relating to things outside of Lazygit like how files are opened,
# copying to clipboard, etc
os:
  # Command for editing a file. Should contain "{{filename}}".
  edit: ""

  # Command for editing a file at a given line number. Should contain
  # "{{filename}}", and may optionally contain "{{line}}".
  editAtLine: ""

  # Same as EditAtLine, except that the command needs to wait until the window is
  # closed.
  editAtLineAndWait: ""

  # Whether lazygit suspends until an edit process returns
  editInTerminal: true

  # For opening a directory in an editor
  openDirInEditor: ""

  # A built-in preset that sets all of the above settings. Supported presets are
  # defined in the getPreset function in editor_presets.go.
  editPreset: "nvim"

  # Command for opening a file, as if the file is double-clicked. Should contain
  # "{{filename}}", but doesn't support "{{line}}".
  open: ""

  # Command for opening a link. Should contain "{{link}}".
  openLink: ""

  # CopyToClipboardCmd is the command for copying to clipboard.
  # See https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md#custom-command-for-copying-to-and-pasting-from-clipboard
  copyToClipboardCmd: ""

  # ReadFromClipboardCmd is the command for reading the clipboard.
  # See https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md#custom-command-for-copying-to-and-pasting-from-clipboard
  readFromClipboardCmd: ""

  # A shell startup file containing shell aliases or shell functions. This will be
  # sourced before running any shell commands, so that shell functions are
  # available in the `:` command prompt or even in custom commands.
  # See https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md#using-aliases-or-functions-in-shell-commands
  shellFunctionsFile: ""

# If true, don't display introductory popups upon opening Lazygit.
disableStartupPopups: true

# User-configured commands that can be invoked from within Lazygit
# See https://github.com/jesseduffield/lazygit/blob/master/docs/Custom_Command_Keybindings.md
customCommands:
  - context: 'global'
    key: 'B'
    command: 'gh browse'
    description: 'Open repo in browser'

  # `B` opens GitHub: the selected commit in the commit views, the repo
  # everywhere else (the context-specific binding wins over the global one).
  - context: 'commits, subCommits'
    key: 'B'
    command: 'gh browse {{.SelectedCommit.Hash}}'
    description: 'Open commit in browser'

  # `A`: git-absorb the staged changes into the commits after the selected one (the
  # selected commit itself is the base, so it is never a target), one fixup! per commit.
  # Whole-file mode matches each hunk against the commits that touched the file, not
  # just the lines it changes.
  - context: 'commits'
    key: 'A'
    description: 'git-absorb staged changes'
    prompts:
      - type: 'menu'
        key: 'Mode'
        title: 'git-absorb{{ with runCommand "git diff --cached --shortstat" }}{{ . }}{{ else }}: nothing staged{{ end }}'
        options:
          - name: 'hunks'
            description: 'match each hunk against the lines it changes'
            value: ''
            key: 'h'
          - name: 'whole file'
            description: 'match each hunk against the whole file'
            value: '--whole-file'
            key: 'w'
    command: 'git absorb --base {{ .SelectedCommit.Hash }} --one-fixup-per-commit {{ .Form.Mode }}'
    output: popup
    outputTitle: 'git-absorb'
    loadingText: 'Absorbing'
    after:
      checkForConflicts: true

  # `r`: git-native rebase of the commits above the selected one (the selected commit is
  # the base and stays put, like git-absorb above). Replaces lazygit's squashAboveCommits.
  # The editor opens in the terminal, except for the autosquash-only option, which skips it.
  - context: 'commits'
    key: 'r'
    description: 'git rebase -i above selected commit'
    prompts:
      - type: 'menu'
        key: 'Mode'
        title: 'git rebase above {{ .SelectedCommit.Name | quote }}'
        options:
          - name: 'interactive'
            description: 'edit the todo list, fixup!/squash! commits pre-arranged'
            value: 'rebase -i --autosquash'
            key: 'i'
          - name: 'above'
            description: 'fold fixup!/squash! commits without opening an editor'
            value: '-c sequence.editor=: rebase -i --autosquash'
            key: 'a'
    command: 'git {{ .Form.Mode }} {{ .SelectedCommit.Hash }}'
    output: terminal
    after:
      checkForConflicts: true

  # `C` in the files panel: commit with an LLM-generated message (`wt step commit`). The
  # first menu option, what is already staged, is the default (enter).
  - context: 'files'
    key: 'C'
    description: 'Commit with generated message (wt)'
    prompts:
      - type: 'menu'
        key: 'Stage'
        title: 'Commit with generated message'
        options:
          - name: 'staged'
            description: 'commit what is already staged'
            value: 'none'
            key: 's'
          - name: 'stage all, then commit'
            description: 'untracked files and unstaged changes too'
            value: 'all'
            key: 'a'
    command: 'wt step commit --stage {{ .Form.Stage }}'
    output: popup
    outputTitle: 'wt step commit'
    loadingText: 'Generating commit message'

  # fugitive in a dedicated nvim, behind two keys with a menu that fits the selection (the
  # first option is the default; a panel with one action skips its menu):
  # - `e` edits: fix a file in an old commit, blame, or open a commit object. In the files
  #   panel `e` is lazygit's own (`os.editPreset`); conflicts resolve with its mergetool (`m` → `m`).
  # - `E` diffs against a target. A single file opens as a split (older left, cursor right);
  #   anything else as a Review: one quickfix entry per hunk (`:Git difftool`, `]q`/`[q`) in
  #   one tab, titled `Review: A → B`, whose hunks the agent keymaps (`<leader>aa` one,
  #   `<leader>aq` all) send to the Agent pane. `r` picks the target from local branches, then
  #   remote branches, then tags, newest first in each (one `for-each-ref`, no shell).
  # Each command starts its own nvim, never the one lazygit may run inside (Snacks.lazygit), so
  # `:qa` there returns to lazygit. A split uses `difftool -y`, which leaves the startup tab
  # empty, hence `-c 'silent! 1tabclose'`. `silent` hides fugitive's `fatal: path … not in
  # <rev>` for each added file, which would stop at a hit-enter prompt; errors still show.
  # fugitive's own failures (a bad ref, `X^` on a root commit, no upstream) just open nothing.
  # shortcut: a path containing `'` breaks its `fnameescape('…')`; double the quote if one turns up.
  - context: 'files'
    key: 'E'
    description: 'Diff in nvim (fugitive)'
    prompts:
      - type: 'menu'
        key: 'T'
        title: 'Diff {{ .SelectedPath }} against'
        condition: '{{ if .SelectedFile }}{{ if .SelectedFile.Tracked }}1{{ end }}{{ else }}1{{ end }}'
        options:
          - { name: 'index', description: 'unstaged changes', value: 'i', key: 'i' }
          - { name: 'HEAD', description: 'all uncommitted changes', value: 'h', key: 'h' }
          - { name: 'fork point', description: 'where this branch forked from the default branch', value: 'b', key: 'b' }
          - { name: 'upstream', description: 'what a push would send, plus uncommitted', value: 'u', key: 'u' }
          - { name: 'ref…', description: 'a branch or tag', value: 'r', key: 'r' }
      - { type: 'menuFromCommand', key: 'Ref', title: 'Diff against', condition: '{{ eq .Form.T "r" }}',
          command: 'git for-each-ref --sort=-creatordate --sort=refname:rstrip=-2 --exclude=refs/remotes/*/HEAD --format=%(refname:short) refs/heads refs/remotes refs/tags' }
    command: |-
      {{ if and .SelectedFile (not .SelectedFile.Tracked) -}}
      echo 'An untracked file has no diff.'; read -r _
      {{- else -}}
      p={{ .SelectedPath | quote }}
      case {{ .Form.T | quote }} in
        i) a= ;;
        h) a=HEAD ;;
        b) base=$(git symbolic-ref --short -q refs/remotes/origin/HEAD) || base=main; a=$(git merge-base "$base" HEAD) ;;
        u) a=@{u} ;;
        r) a={{ .Form.Ref | quote }} ;;
      esac
      {{ if .SelectedFile -}}
      nvim -c "exe 'silent Git difftool -y $a -- ' .. fnameescape('$p')" -c 'silent! 1tabclose'
      {{- else -}}
      nvim -c "exe 'silent Git difftool $a -- ' .. fnameescape('$p')" -c "call setqflist([], 'a', {'title': 'Review: ${a:-index} → working tree, $p'})" -c copen -c 'wincmd p'
      {{- end }}
      {{- end }}
    output: terminal

  - context: 'commits, subCommits, reflogCommits'
    key: 'e'
    description: 'Open commit in nvim (fugitive)'
    command: 'nvim -c "Gedit {{ .SelectedCommit.Hash }}"'
    output: terminal

  # The selected commit(s), From (oldest) to To (newest).
  - context: 'commits, subCommits, reflogCommits'
    key: 'E'
    description: 'Diff in nvim (fugitive)'
    prompts:
      - type: 'menu'
        key: 'T'
        title: 'Diff {{ slice .SelectedCommitRange.From 0 8 }}..{{ slice .SelectedCommitRange.To 0 8 }} against'
        options:
          - { name: 'parent', description: 'what the commit(s) changed', value: 'p', key: 'p' }
          - { name: 'working tree', description: 'the commit(s) and everything since, uncommitted too', value: 'w', key: 'w' }
          - { name: 'HEAD', description: 'everything committed after them', value: 'h', key: 'h' }
          - { name: 'ref…', description: 'a branch or tag', value: 'r', key: 'r' }
      - { type: 'menuFromCommand', key: 'Ref', title: 'Diff against', condition: '{{ eq .Form.T "r" }}',
          command: 'git for-each-ref --sort=-creatordate --sort=refname:rstrip=-2 --exclude=refs/remotes/*/HEAD --format=%(refname:short) refs/heads refs/remotes refs/tags' }
    command: |-
      f={{ slice .SelectedCommitRange.From 0 12 }} t={{ slice .SelectedCommitRange.To 0 12 }}
      case {{ .Form.T | quote }} in
        p) a="$f^" b="$t" ;;
        w) a="$f^" b= ;;
        h) a="$t" b=HEAD ;;
        r) a={{ .Form.Ref | quote }} b="$t" ;;
      esac
      nvim -c "silent Git difftool $a $b" -c "call setqflist([], 'a', {'title': 'Review: $a → ${b:-working tree}'})" -c copen -c 'wincmd p'
    output: terminal

  # Fix the file in this commit: the working-tree file (right, editable) beside the commit's
  # version. After you edit and quit, its changes become a `fixup!` of the commit, left for
  # you to fold in (`r` on a commit below it). Refused when the file has uncommitted changes
  # (they would land in the fixup) or the commit is not on the checked-out branch. Blame opens
  # beside the file, the cursor on the file (`wincmd l`); in the blame, `~`/`P` re-blame at the
  # parent and `o` opens the commit of a line.
  - context: 'commitFiles'
    key: 'e'
    description: 'Edit file at this commit in nvim (fugitive)'
    prompts:
      - type: 'menu'
        key: 'Do'
        title: 'Edit {{ .SelectedPath }} at {{ slice .SelectedCommit.Hash 0 8 }}'
        condition: '{{ if .SelectedCommitFile }}1{{ end }}'
        options:
          - { name: 'fix in this commit', description: 'edit, then a fixup! commit (not folded)', value: 'f', key: 'f' }
          - { name: 'blame', description: 'the file as it is at this commit', value: 'b', key: 'b' }
    command: |-
      {{ if not .SelectedCommitFile -}}
      echo 'e works on a single file, not a folder.'; read -r _
      {{- else -}}
      sha={{ .SelectedCommit.Hash }} f={{ .SelectedPath | quote }}
      case {{ .Form.Do | quote }} in
        f)
          s=$(git rev-parse --short "$sha")
          git merge-base --is-ancestor "$sha" HEAD || { echo "$s is not on the checked-out branch."; read -r _; exit; }
          git diff --quiet HEAD -- "$f" || { echo "$f has uncommitted changes; commit or stash them first."; read -r _; exit; }
          nvim -c "exe 'edit ' .. fnameescape('$f')" -c "Gvdiffsplit! $sha"
          git diff --quiet HEAD -- "$f" && exit
          git commit -q --fixup="$sha" -- "$f" || read -r _ ;;
        b) nvim -c "exe 'Gedit $sha:' .. fnameescape('$f')" -c 'Git blame' -c 'wincmd l' ;;
      esac
      {{- end }}
    output: terminal

  - context: 'commitFiles'
    key: 'E'
    description: 'Diff at this commit in nvim (fugitive)'
    prompts:
      - type: 'menu'
        key: 'T'
        title: 'Diff {{ .SelectedPath }} at {{ slice .SelectedCommit.Hash 0 8 }} against'
        options:
          - { name: 'parent', description: 'what this commit changed', value: 'p', key: 'p' }
          - { name: 'working tree', description: 'how it changed since, uncommitted too', value: 'w', key: 'w' }
          - { name: 'HEAD', description: 'how it changed since, committed only', value: 'h', key: 'h' }
          - { name: 'ref…', description: 'a branch or tag', value: 'r', key: 'r' }
      - { type: 'menuFromCommand', key: 'Ref', title: 'Diff against', condition: '{{ eq .Form.T "r" }}',
          command: 'git for-each-ref --sort=-creatordate --sort=refname:rstrip=-2 --exclude=refs/remotes/*/HEAD --format=%(refname:short) refs/heads refs/remotes refs/tags' }
    command: |-
      x={{ slice .SelectedCommit.Hash 0 12 }} p={{ .SelectedPath | quote }}
      case {{ .Form.T | quote }} in
        p) a="$x^" b="$x" ;;
        w) a="$x" b= ;;
        h) a="$x" b=HEAD ;;
        r) a={{ .Form.Ref | quote }} b="$x" ;;
      esac
      {{ if .SelectedCommitFile -}}
      nvim -c "exe 'silent Git difftool -y $a $b -- ' .. fnameescape('$p')" -c 'silent! 1tabclose'
      {{- else -}}
      nvim -c "exe 'silent Git difftool $a $b -- ' .. fnameescape('$p')" -c "call setqflist([], 'a', {'title': 'Review: $a → ${b:-working tree}, $p'})" -c copen -c 'wincmd p'
      {{- end }}
    output: terminal

  # A branch, local or remote. Fork point: its merge base with the default branch (origin's
  # HEAD, else main).
  - context: 'localBranches'
    key: 'E'
    description: 'Diff in nvim (fugitive)'
    prompts:
      - type: 'menu'
        key: 'T'
        title: 'Diff {{ .SelectedLocalBranch.Name }} against'
        options:
          - { name: 'fork point', description: 'its commits since it forked from the default branch', value: 'b', key: 'b' }
          - { name: 'HEAD', description: 'the checked-out commit', value: 'h', key: 'h' }
          - { name: 'working tree', description: 'the checked-out files, uncommitted too', value: 'w', key: 'w' }
          - { name: 'upstream', description: 'what a push would send', value: 'u', key: 'u' }
          - { name: 'ref…', description: 'a branch or tag', value: 'r', key: 'r' }
      - { type: 'menuFromCommand', key: 'Ref', title: 'Diff against', condition: '{{ eq .Form.T "r" }}',
          command: 'git for-each-ref --sort=-creatordate --sort=refname:rstrip=-2 --exclude=refs/remotes/*/HEAD --format=%(refname:short) refs/heads refs/remotes refs/tags' }
    command: |-
      x={{ .SelectedLocalBranch.Name | quote }}
      case {{ .Form.T | quote }} in
        b) base=$(git symbolic-ref --short -q refs/remotes/origin/HEAD) || base=main; a=$(git merge-base "$base" "$x" | cut -c1-12) b="$x" ;;
        h) a=HEAD b="$x" ;;
        w) a="$x" b= ;;
        u) a="$x@{u}" b="$x" ;;
        r) a={{ .Form.Ref | quote }} b="$x" ;;
      esac
      nvim -c "silent Git difftool $a $b" -c "call setqflist([], 'a', {'title': 'Review: $a → ${b:-working tree}'})" -c copen -c 'wincmd p'
    output: terminal

  - context: 'remoteBranches'
    key: 'E'
    description: 'Diff in nvim (fugitive)'
    prompts:
      - type: 'menu'
        key: 'T'
        title: 'Diff {{ .SelectedRemoteBranch.RemoteName }}/{{ .SelectedRemoteBranch.Name }} against'
        options:
          - { name: 'fork point', description: 'its commits since it forked from the default branch', value: 'b', key: 'b' }
          - { name: 'HEAD', description: 'the checked-out commit', value: 'h', key: 'h' }
          - { name: 'working tree', description: 'the checked-out files, uncommitted too', value: 'w', key: 'w' }
          - { name: 'ref…', description: 'a branch or tag', value: 'r', key: 'r' }
      - { type: 'menuFromCommand', key: 'Ref', title: 'Diff against', condition: '{{ eq .Form.T "r" }}',
          command: 'git for-each-ref --sort=-creatordate --sort=refname:rstrip=-2 --exclude=refs/remotes/*/HEAD --format=%(refname:short) refs/heads refs/remotes refs/tags' }
    command: |-
      x={{ printf "%s/%s" .SelectedRemoteBranch.RemoteName .SelectedRemoteBranch.Name | quote }}
      case {{ .Form.T | quote }} in
        b) base=$(git symbolic-ref --short -q refs/remotes/origin/HEAD) || base=main; a=$(git merge-base "$base" "$x" | cut -c1-12) b="$x" ;;
        h) a=HEAD b="$x" ;;
        w) a="$x" b= ;;
        r) a={{ .Form.Ref | quote }} b="$x" ;;
      esac
      nvim -c "silent Git difftool $a $b" -c "call setqflist([], 'a', {'title': 'Review: $a → ${b:-working tree}'})" -c copen -c 'wincmd p'
    output: terminal

  - context: 'tags'
    key: 'E'
    description: 'Diff in nvim (fugitive)'
    prompts:
      - type: 'menu'
        key: 'T'
        title: 'Diff {{ .SelectedTag.Name }} against'
        options:
          - { name: 'HEAD', description: 'the checked-out commit', value: 'h', key: 'h' }
          - { name: 'working tree', description: 'the checked-out files, uncommitted too', value: 'w', key: 'w' }
          - { name: 'ref…', description: 'a branch or tag', value: 'r', key: 'r' }
      - { type: 'menuFromCommand', key: 'Ref', title: 'Diff against', condition: '{{ eq .Form.T "r" }}',
          command: 'git for-each-ref --sort=-creatordate --sort=refname:rstrip=-2 --exclude=refs/remotes/*/HEAD --format=%(refname:short) refs/heads refs/remotes refs/tags' }
    command: |-
      x={{ .SelectedTag.Name | quote }}
      case {{ .Form.T | quote }} in
        h) a=HEAD b="$x" ;;
        w) a="$x" b= ;;
        r) a={{ .Form.Ref | quote }} b="$x" ;;
      esac
      nvim -c "silent Git difftool $a $b" -c "call setqflist([], 'a', {'title': 'Review: $a → ${b:-working tree}'})" -c copen -c 'wincmd p'
    output: terminal

  # A worktree (`git wt`): what it has not committed (nvim starts there), or its branch's
  # commits since it forked from the default branch.
  - context: 'worktrees'
    key: 'E'
    description: 'Diff in nvim (fugitive)'
    prompts:
      - type: 'menu'
        key: 'T'
        title: 'Diff {{ .SelectedWorktree.Branch }} against'
        options:
          - { name: 'HEAD', description: 'its uncommitted changes, in that worktree', value: 'h', key: 'h' }
          - { name: 'fork point', description: 'its commits since it forked from the default branch', value: 'b', key: 'b' }
    command: |-
      case {{ .Form.T | quote }} in
        h) cd {{ .SelectedWorktree.Path | quote }} || exit; r=HEAD t='HEAD → working tree' ;;
        b)
          base=$(git symbolic-ref --short -q refs/remotes/origin/HEAD) || base=main
          r="$(git merge-base "$base" {{ .SelectedWorktree.Branch | quote }} | cut -c1-12) {{ .SelectedWorktree.Branch }}" t="fork point → {{ .SelectedWorktree.Branch }}" ;;
      esac
      nvim -c "silent Git difftool $r" -c "call setqflist([], 'a', {'title': 'Review: {{ .SelectedWorktree.Branch }}, $t'})" -c copen -c 'wincmd p'
    output: terminal

  # A stash entry: its working-tree commit.
  - context: 'stash'
    key: 'E'
    description: 'Diff in nvim (fugitive)'
    prompts:
      - type: 'menu'
        key: 'T'
        title: 'Diff {{ printf "stash@{%d}" .SelectedStashEntry.Index }} against'
        options:
          - { name: 'parent', description: 'what was stashed', value: 'p', key: 'p' }
          - { name: 'working tree', description: 'the checked-out files, uncommitted too', value: 'w', key: 'w' }
    command: |-
      x={{ printf "stash@{%d}" .SelectedStashEntry.Index | quote }}
      case {{ .Form.T | quote }} in
        p) a="$x^" b="$x" ;;
        w) a="$x" b= ;;
      esac
      nvim -c "silent Git difftool $a $b" -c "call setqflist([], 'a', {'title': 'Review: $a → ${b:-working tree}'})" -c copen -c 'wincmd p'
    output: terminal

  # Make worktrees with `fzj wt new`, which also opens their zellij tab,
  # in place of lazygit's own `n` (worktrees) and `w` (branches). Only `n` offers
  # --move-uncommitted: fzj allows it for a new branch only.
  - context: 'worktrees'
    key: 'n'
    prompts:
      - type: 'input'
        title: 'Branch for new worktree'
        key: 'Branch'
      - type: 'menu'
        title: 'Uncommitted changes'
        key: 'Move'
        options:
          - name: 'leave them here'
            description: 'new branch starts from the default base'
            value: ''
            key: 'l'
          - name: 'move them to the new worktree'
            description: 'staged, unstaged and untracked; new branch starts from this commit'
            value: '--move-uncommitted'
            key: 'm'
    command: 'fzj wt new {{ .Form.Move }} {{ .Form.Branch | quote }}'
    description: 'New worktree (fzj wt)'

  - context: 'localBranches'
    key: 'w'
    command: 'fzj wt new {{.SelectedLocalBranch.Name | quote}}'
    description: 'New worktree from branch (fzj wt)'

  # `n` on a commit: a new branch from it, in a new worktree, in place of lazygit's
  # plain new branch. The args after -- go to `wt switch`.
  - context: 'commits, subCommits'
    key: 'n'
    prompts:
      - type: 'input'
        title: 'New worktree branch from {{ slice .SelectedCommit.Hash 0 8 }} {{ .SelectedCommit.Name }}'
        key: 'Branch'
    command: 'fzj wt new {{ .Form.Branch | quote }} -- --base {{ .SelectedCommit.Hash }}'
    description: 'New worktree from commit (fzj wt)'

  # `n` on a remote branch: a local branch from it, in a new worktree, in place of
  # lazygit's plain checkout. Keeping the remote's name makes it track the remote
  # branch; another name gets no upstream. A branch that has a worktree is reused.
  - context: 'remoteBranches'
    key: 'n'
    prompts:
      - type: 'input'
        title: 'New worktree branch from {{ .SelectedRemoteBranch.RemoteName }}/{{ .SelectedRemoteBranch.Name }}'
        key: 'Branch'
        initialValue: '{{ .SelectedRemoteBranch.Name }}'
    command: 'fzj wt new {{ .Form.Branch | quote }} -- --base {{ printf `%s/%s` .SelectedRemoteBranch.RemoteName .SelectedRemoteBranch.Name | quote }}'
    description: 'New worktree from remote branch (fzj wt)'

  # `w` on a tag, as on a local branch: a new branch from the tag, in a new worktree
  # (`n` there still makes a tag).
  - context: 'tags'
    key: 'w'
    prompts:
      - type: 'input'
        title: 'New worktree branch from tag {{ .SelectedTag.Name }}'
        key: 'Branch'
    command: 'fzj wt new {{ .Form.Branch | quote }} -- --base {{ .SelectedTag.Name | quote }}'
    description: 'New worktree from tag (fzj wt)'

  # `A` on a worktree or local branch: `fzj wt absorb` it into this worktree, after a
  # confirm that shows what comes over (none on this worktree's own row, where fzj
  # refuses). In a terminal, since fzj can prompt (uncommitted changes, wt hooks),
  # and a failure waits there for enter.
  - context: 'worktrees'
    key: 'A'
    description: 'Absorb worktree into this one (fzj wt)'
    prompts:
      - type: 'confirm'
        key: 'Confirm'
        condition: '{{ not .SelectedWorktree.IsCurrent }}'
        title: 'Absorb {{ .SelectedWorktree.Branch }} into {{ .CheckedOutBranch.Name }}?'
        body: "{{ runCommand (printf `git rev-list --count %s..%s` .CheckedOutBranch.Name .SelectedWorktree.Branch) }} commit(s) to bring over{{ with runCommand (printf `git diff --shortstat %s...%s` .CheckedOutBranch.Name .SelectedWorktree.Branch) }}:{{ . }}{{ end }}.\n\nBy default wt merge squashes them, rebases onto {{ .CheckedOutBranch.Name }}, fast-forwards it, and removes the worktree; fzj then closes its zellij tabs. Uncommitted changes there are offered for commit first."
    command: 'fzj wt absorb {{ .SelectedWorktree.Branch | quote }}'
    output: terminal

  - context: 'localBranches'
    key: 'A'
    description: "Absorb branch's worktree into this one (fzj wt)"
    prompts:
      - type: 'confirm'
        key: 'Confirm'
        condition: '{{ not .SelectedLocalBranch.Head }}'
        title: 'Absorb {{ .SelectedLocalBranch.Name }} into {{ .CheckedOutBranch.Name }}?'
        body: "{{ runCommand (printf `git rev-list --count %s..%s` .CheckedOutBranch.Name .SelectedLocalBranch.Name) }} commit(s) to bring over{{ with runCommand (printf `git diff --shortstat %s...%s` .CheckedOutBranch.Name .SelectedLocalBranch.Name) }}:{{ . }}{{ end }}.\n\nBy default wt merge squashes them, rebases onto {{ .CheckedOutBranch.Name }}, fast-forwards it, and removes the worktree; fzj then closes its zellij tabs. Uncommitted changes there are offered for commit first."
    command: 'fzj wt absorb {{ .SelectedLocalBranch.Name | quote }}'
    output: terminal

# See https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md#custom-pull-request-urls
services: {}

# What to do when opening Lazygit outside of a git repo.
# - 'prompt': (default) ask whether to initialize a new repo or open in the most
# recent repo
# - 'create': initialize a new repo
# - 'skip': open most recent repo
# - 'quit': exit Lazygit
notARepository: skip

# If true, display a confirmation when subprocess terminates. This allows you to
# view the output of the subprocess before returning to Lazygit.
promptToReturnFromSubprocess: false

# Keybindings.
# Each binding can be a single key or a list of keys; see
# https://github.com/jesseduffield/lazygit/blob/master/docs/keybindings/Custom_Keybindings.md
# for the syntax.

# Keybindings.
# Each binding can be a single key or a list of keys; see
# https://github.com/jesseduffield/lazygit/blob/master/docs/keybindings/Custom_Keybindings.md
# for the syntax.
keybinding:
  universal:
    quit: [q, <ctrl+c>]
    quit-alt1: '<disabled>'
    suspendApp: <disabled>
    return: <esc>
    quitWithoutChangingDirectory: Q
    togglePanel: <tab>
    prevItem: ['<up>', 'k', '<ctrl+p>']
    nextItem: ['<down>', 'j', '<ctrl+n>']
    prevItem-alt: '<disabled>'
    nextItem-alt: '<disabled>'
    prevPage: '<ctrl+u>'
    nextPage: '<ctrl+d>'
    scrollLeft: '<disabled>'
    scrollRight: '<disabled>'
    gotoTop: '<disabled>'  # ctrl+u instead (`g` does not play nicely with the command palette)
    gotoBottom: '<disabled>' # ctrl+d instead (`G` does not play nicely with the command palette)
    toggleRangeSelect: 'V'
    rangeSelectDown: '<disabled>'
    rangeSelectUp: '<disabled>'
    nextBlock: '<ctrl+j>'
    prevBlock: '<ctrl+k>'
    nextBlock-alt: '<disabled>'
    prevBlock-alt: '<disabled>'
    nextBlock-alt2: '<disabled>'
    prevBlock-alt2: '<disabled>'
    jumpToBlock:
      - "1"
      - "2"
      - "3"
      - "4"
      - "5"
    focusMainView: "|"
    jumpToFile: <ctrl+f>
    nextMatch: 'n'
    prevMatch: 'N'
    startSearch: '/'

    # <alt+left> on Mac
    moveWordLeft: <alt+left>

    # <alt+right> on Mac
    moveWordRight: <alt+right>

    # <alt+backspace> on Mac
    backspaceWord: <disabled>

    # <alt+delete> on Mac
    forwardDeleteWord: <disabled>
    optionMenu: ['?', '<space>', '<ctrl+shift+p>']
    optionMenu-alt1: '<disabled>'
    select: '-'
    goInto: '<enter>'
    confirm: '<enter>'
    confirmMenu: <enter>
    confirmSuggestion: <enter>

    # <meta+enter> on Mac
    confirmInEditor: '<disabled>'
    remove: X
    new: 'n'
    newWorktree: '<disabled>' # Replaced by the `fzj wt` custom commands
    edit: 'e'
    openFile: 'o'
    scrollUpMain: 'K'
    scrollDownMain: 'J'
    scrollUpMain-alt1: '<disabled>'
    scrollDownMain-alt1: '<disabled>'
    scrollUpMain-alt2: '<disabled>'
    scrollDownMain-alt2: '<disabled>'
    executeShellCommand: [':', '!']
    createRebaseOptionsMenu: 'R'

    # 'Files' appended for legacy reasons
    pushFiles: '>'

    # 'Files' appended for legacy reasons
    pullFiles: '<'
    refresh: '<f5>'
    createPatchOptionsMenu: '<ctrl+a>'  # Mnemonic = "apply"
    nextTab: '<tab>'
    prevTab: '<backtab>'
    nextScreenMode: '<right>'
    prevScreenMode: '<left>'
    cycleDiffRenderers: '<disabled>'
    cycleDiffRenderersReverse: <disabled>
    undo: '<disabled>'
    redo: '<disabled>'
    filteringMenu: '<ctrl+r>'  # Mnemonic = "revisions"
    diffingMenu: [W, <ctrl+e>]
    diffingMenu-alt: '<disabled>'
    copyToClipboard: 'y'
    openRecentRepos: '<ctrl+o>'
    submitEditorText: '<enter>'
    extrasMenu: ['@', '`']
    toggleWhitespaceInDiffView: '<disabled>'
    increaseContextInDiffView: '}'
    decreaseContextInDiffView: '{'
    increaseRenameSimilarityThreshold: ')'
    decreaseRenameSimilarityThreshold: '('
    openDiffTool: '<disabled>' # `E` is the fugitive diff custom command (see there)
    editConfig: <disabled>
  status:
    checkForUpdate: '<disabled>'
    recentRepos: <enter>
    allBranchesLogGraph: a
    allBranchesLogGraphReverse: A
  files:
    commitChanges: 'c'
    commitChangesWithoutHook: '<disabled>'
    amendLastCommit: 'A'
    commitChangesWithEditor: '<disabled>'
    findBaseCommitForFixup: 'f'
    confirmDiscard: x
    ignoreFile: 'i'
    refreshFiles: 'r'
    stashAllChanges: 'S'
    viewStashOptions: 's'
    toggleStagedAll: '+'
    viewResetOptions: '<disabled>'
    fetch: '<disabled>'
    toggleTreeView: 't'
    openMergeOptions: 'm'
    openStatusFilter: <ctrl+s>
    copyFileInfoToClipboard: 'y'
    collapseAll: 'H'
    expandAll: 'L'
  branches:
    createPullRequest: '<disabled>'
